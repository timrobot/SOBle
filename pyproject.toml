[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soble"
version = "0.1.0"
description = "BLE host API and leader-arm teleop for the SO101 robot platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "bleak>=0.21",
    "numpy>=1.20",
    "opencv-python-headless>=4.5",
    "pyapriltags>=0.3",
    "pygame>=2.5",
    "pyserial>=3.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["soble*"]
